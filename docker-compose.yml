version: "3.9"

services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe
    ports:
      - "1521:1521"   # SQL*Net (CLI/JDBC)
      - "5500:5500"   # EM Express (웹 UI)
    environment:
      ORACLE_PASSWORD: 
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data: